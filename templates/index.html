<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Container do formulário */
#licitacao-form {
    background: white;
    width: 100%;
    max-width: 500px;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);

    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* Inputs */
#licitacao-form input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.2s ease;
    outline: none;
}

#licitacao-form input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

/* Botão */
#licitacao-form button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s ease;
}

#licitacao-form button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

#results {
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
}
</style>
<form id="licitacao-form">
    <input type="number" name="number_days" placeholder="Dias Antecedentes" required>

    <!-- <input type="email" id="email" placeholder="Email" required> -->
    <!-- <input type="password" id="password" placeholder="Senha" required> -->

    <input type="text" name="keywords" placeholder="Palavras-chave separadas por vírgula" required>


    <button type="submit">Enviar</button>
</form>

<div id="results"></div>

<script src="static/script.js"></script>
